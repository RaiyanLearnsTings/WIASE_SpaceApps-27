<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIASE · Crew Health Console</title>
  <meta name="description" content="Deep-space crew health decision-support demo: live synthetic telemetry, personal baselines, explainable alerts, a 3D anatomy view per astronaut and a top-view cabin sensor map.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23000000'/%3E%3Cpath d='M9 23 15 9M17 23 23 9' stroke='%23C5003C' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="vendor/fonts/ibm-plex-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/fonts/plex.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a class="skip-link" href="#card-crew">Skip to crew overview</a>
  <div class="app">
    <!-- Loading outline: each block is replaced as soon as its panel mounts. -->
    <header class="topbar" id="topbar">
      <div class="brand"><span class="brand__mark" aria-hidden="true">//</span><strong>WIASE</strong></div>
      <span class="boot-status mono small" id="boot-status" role="status">Starting…</span>
    </header>
    <main class="dash" aria-label="Mission dashboard">
      <div class="dash__col dash__col--left">
        <section class="card card--alerts" id="card-alerts" aria-label="Alerts"><div class="skel" aria-hidden="true"><i class="skel__title"></i><i></i><i></i><i class="skel__short"></i></div></section>
        <section class="card card--todo" id="card-todo" aria-label="To-do"><div class="skel" aria-hidden="true"><i class="skel__title"></i><i></i><i></i><i class="skel__short"></i></div></section>
      </div>
      <div class="dash__col dash__col--right">
        <section class="card card--cabin" id="card-cabin" aria-label="Cabin environment"><div class="skel" aria-hidden="true"><i class="skel__title"></i><i class="skel__block"></i></div></section>
        <section class="card card--crew" id="card-crew" aria-label="Crew overview" tabindex="-1"><div class="skel" aria-hidden="true"><i class="skel__title"></i><i class="skel__block"></i></div></section>
      </div>
    </main>
  </div>

  <dialog id="page" class="page"></dialog>
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" popover="manual"></div>
  <noscript>WIASE needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.mjs"></script>
</body>
</html>
